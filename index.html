<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presentes para Namorada | Gift Ideas</title>

<style>
body{
font-family: Arial, sans-serif;
margin:0;
background:#f5f5f5;
color:#222;
}

header{
background:#111;
color:white;
text-align:center;
padding:40px 20px;
}

.container{
max-width:1000px;
margin:auto;
padding:20px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:white;
padding:15px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
display:flex;
flex-direction:column;
}

.card img{
width:100%;
aspect-ratio:1/1;
object-fit:cover;
border-radius:8px;
}

.title{
font-weight:bold;
margin:10px 0 5px 0;
}

.desc{
font-size:14px;
margin-bottom:10px;
}

.btn{
margin-top:auto;
background:#e91e63;
color:white;
text-align:center;
padding:10px;
border-radius:6px;
text-decoration:none;
font-weight:bold;
}
.btn:hover{
opacity:0.85;
}
</style>

</head>

<body>

<header>
<h1>🎁 Presentes para Namorada</h1>
<p>Romantic Gift Ideas | Ideias de Presentes Românticos</p>
</header>

<div class="container">

<div class="grid">

<!-- PRODUTO 1 -->
<div class="card">
<img src="https://via.placeholder.com/400">
<div class="title">Produto Exemplo</div>
<div class="desc">
Descrição em Português.<br>
Description in English.
</div>
<a class="btn" href="#" target="_blank">
VER PREÇO / SEE PRICE
</a>
</div>

</div>
</div>

</body>
</html>
